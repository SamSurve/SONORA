<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Times New Roman', Times, serif;
    }

    .background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* The wallpaper you chose */
        background: url('https://getwallpapers.com/wallpaper/full/7/a/b/754028-music-wallpapers-1920x1080-for-phones.jpg');
        background-size: cover;
        background-position: center;
        z-index: -1;
    }

    .dark-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Adds a smooth dark fade so the input box pops */
        background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
        z-index: 0;
    }

    .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 5rem;
        letter-spacing: 15px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    p {
        font-style: italic;
        letter-spacing: 2px;
        opacity: 0.8;
    }

    /* Styling your input and button to match the vibe */
    input[type="text"] {
        padding: 15px;
        width: 400px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 5px;
        color: white;
        backdrop-filter: blur(5px);
        margin-top: 30px;
    }

    button {
        padding: 15px 30px;
        margin-top: 15px;
        background: white;
        color: black;
        border: none;
        cursor: pointer;
        letter-spacing: 2px;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        background: #ccc;
    }
</style>

<body>
    <div class="background-container"></div>
    <div class="dark-overlay"></div>

    <div class="content">
        <h1>AURALIS</h1>
        <p>Your journey into the ultimate sound paradise begins here.</p>
        
        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="Paste YouTube or Playlist link..." required autocomplete="off">
            <br>
            <button type="submit">GET 320KBPS MP3</button>
        </form>
    </div>
</body>
